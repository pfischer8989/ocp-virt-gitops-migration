# App-of-apps: syncs the child Applications in apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-migration-root
  namespace: openshift-gitops
spec:
  project: vm-migration
  source:
    repoURL: https://github.com/pfischer8989/ocp-virt-gitops-migration.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
