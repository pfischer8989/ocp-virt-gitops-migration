apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vm-migration
  namespace: openshift-gitops
spec:
  description: Declarative VMware -> OpenShift Virtualization migration and VM lifecycle
  sourceRepos:
    - https://github.com/pfischer8989/ocp-virt-gitops-migration.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
