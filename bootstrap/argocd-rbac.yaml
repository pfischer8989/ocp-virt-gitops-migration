# Demo-grade: give the default Argo CD instance cluster-admin so it can manage
# MTV Plans/Maps in openshift-mtv, Namespaces, and VirtualMachines anywhere.
# Tighten to a scoped ClusterRole for anything beyond a demo.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-vm-migration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
