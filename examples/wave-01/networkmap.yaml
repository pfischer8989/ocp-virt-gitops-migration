# vSphere port group -> OpenShift pod network (masquerade).
apiVersion: forklift.konveyor.io/v1beta1
kind: NetworkMap
metadata:
  name: wave-01-network
  namespace: openshift-mtv
  labels:
    migration-wave: wave-01
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    source:
      name: vmware
      namespace: openshift-mtv
    destination:
      name: host
      namespace: openshift-mtv
  map:
    - source:
        name: segment-migrating-to-ocpvirt
      destination:
        type: pod
