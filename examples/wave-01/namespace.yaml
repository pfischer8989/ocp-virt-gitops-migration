# Target namespace for wave-01. Never pruned by Argo CD: removing the wave from Git
# must not delete the VMs that were migrated into it.
apiVersion: v1
kind: Namespace
metadata:
  name: vm-wave-01
  labels:
    migration-wave: wave-01
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
