# vSphere datastore -> ODF Ceph RBD (RWX block, so VMs stay live-migratable).
apiVersion: forklift.konveyor.io/v1beta1
kind: StorageMap
metadata:
  name: wave-00-rehearsal-storage
  namespace: openshift-mtv
  labels:
    migration-wave: wave-00-rehearsal
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    source:
      name: vmware
      namespace: openshift-mtv
    destination:
      name: host
      namespace: openshift-mtv
  map:
    - source:
        name: workloadshare
      destination:
        storageClass: ocs-external-storagecluster-ceph-rbd
        accessMode: ReadWriteMany
        volumeMode: Block
